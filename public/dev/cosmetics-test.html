<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goblin Wardrobe Test</title>
<style>
  :root { --bg: #1d2230; --panel: rgba(18, 21, 30, 0.86); --text: #f2f2f2; --muted: #9aa3b5; --accent: #ffd23f; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.35 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .lbl { position: absolute; transform: translate(-50%, -100%); text-align: center; white-space: nowrap;
         background: rgba(0, 0, 0, 0.55); padding: 2px 6px; border-radius: 6px; font-size: 11px; }
  .lbl b { color: var(--accent); font-weight: 600; }
  .lbl .sub { color: var(--muted); font-size: 10px; }
  .lbl .warn { color: #ff6b6b; }
  #panel { position: fixed; top: 10px; left: 10px; background: var(--panel); padding: 10px 12px; border-radius: 10px;
           max-width: min(360px, calc(100vw - 44px)); }
  #panel h1 { font-size: 15px; margin: 0 0 6px; }
  #panel label { display: inline-flex; gap: 4px; align-items: center; margin-right: 10px; }
  #panel select { max-width: 200px; }
  #stats { color: var(--muted); margin-top: 6px; }
  #swatches { position: fixed; bottom: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 4px;
              background: var(--panel); padding: 6px; border-radius: 10px; }
  .sw { display: flex; align-items: center; gap: 4px; font-size: 10px; padding: 2px 5px 2px 2px; border-radius: 4px; background: rgba(255,255,255,0.06); }
  .sw i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  #emotes { margin-top: 6px; font-size: 12px; }
</style>
</head>
<body>
<div id="labels"></div>
<div id="panel">
  <h1>Don't Wake Gerald: cosmetics check</h1>
  <label><input type="checkbox" id="rotate" checked> rotate</label>
  <label><input type="checkbox" id="cycle" checked> cycle eyes/colours</label>
  <label><input type="checkbox" id="labelsOn" checked> labels</label>
  <div style="margin-top:6px">
    <label>focus <select id="focus"><option value="-1">(whole grid)</option></select></label>
  </div>
  <div id="stats"></div>
  <div id="emotes"></div>
  <div style="color:var(--muted);margin-top:4px">drag to orbit, wheel to zoom</div>
</div>
<div id="swatches"></div>

<script type="module">
import * as THREE from '../vendor/three.min.js';
import { HATS, COLORS, EYES, EMOTES, buildHat, buildEyes, bodyMaterial, colorHex } from '../js/cosmetics.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a3142);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 200);

scene.add(new THREE.HemisphereLight(0xdfe9ff, 0x4a3b2a, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(6, 12, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 40 });
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffe6cc, 0.6);
fill.position.set(-6, 4, 6);
scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x3b4458, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// --- goblin bean matching the game's conventions --------------------------------
// origin at feet, Y up, faces +Z, radius ~0.45, height 1.3; lathe UV u wraps, v 0 feet -> 1 top
function beanGeometry() {
  const pts = [];
  const N = 28, mid = 0.55, R = 0.45;
  for (let i = 0; i <= N; i++) {
    const y = (i / N) * 1.3;
    let r;
    if (y <= mid) { const t = (mid - y) / mid; r = R * Math.pow(Math.max(0, 1 - Math.pow(t, 3)), 1 / 3); }
    else { const t = (y - mid) / 0.75; r = R * Math.pow(Math.max(0, 1 - Math.pow(t, 2.2)), 1 / 2.2); }
    pts.push(new THREE.Vector2(Math.max(r, i === 0 || i === N ? 0 : 0.001), y));
  }
  return new THREE.LatheGeometry(pts, 40);
}
const BEAN = beanGeometry();
const footGeo = new THREE.SphereGeometry(0.13, 12, 8);
const footMat = new THREE.MeshStandardMaterial({ color: 0x2b2b33, roughness: 0.8 });

function triCount(obj) {
  let n = 0;
  obj.traverse(o => {
    if (!o.isMesh) return;
    const g = o.geometry;
    n += (g.index ? g.index.count : g.attributes.position.count) / 3;
  });
  return Math.round(n);
}

const COLS = 8, SPACING = 1.7;
const rows = Math.ceil(HATS.length / COLS);
const goblins = [];
const labelsEl = document.getElementById('labels');
const focusSel = document.getElementById('focus');
let maxTris = 0, maxTrisHat = '';

HATS.forEach((hat, i) => {
  const root = new THREE.Group();
  const c = i % COLS, r = Math.floor(i / COLS);
  root.position.set((c - (COLS - 1) / 2) * SPACING, 0, (r - (rows - 1) / 2) * SPACING * 1.25);
  scene.add(root);
  const spinner = new THREE.Group();
  root.add(spinner);
  const body = new THREE.Mesh(BEAN, bodyMaterial(COLORS[i % COLORS.length].id));
  body.castShadow = body.receiveShadow = true;
  spinner.add(body);
  for (const s of [-1, 1]) {
    const f = new THREE.Mesh(footGeo, footMat);
    f.position.set(s * 0.18, 0.04, 0.08); f.scale.set(1, 0.5, 1.4); f.castShadow = true;
    spinner.add(f);
  }
  const hatObj = buildHat(hat.id);
  hatObj.position.set(0, 1.25, 0);
  spinner.add(hatObj);
  const tris = triCount(hatObj);
  if (tris > maxTris) { maxTris = tris; maxTrisHat = hat.id; }
  const div = document.createElement('div');
  div.className = 'lbl';
  labelsEl.appendChild(div);
  const opt = document.createElement('option');
  opt.value = i; opt.textContent = `${hat.name} (${hat.id})`;
  focusSel.appendChild(opt);
  goblins.push({ i, hat, root, spinner, body, hatObj, eyes: null, tris, div, phase: Math.random() * 10 });
});

let cycleOffset = 0;
function dress(gob) {
  const color = COLORS[(gob.i + cycleOffset) % COLORS.length];
  const eyeDef = EYES[(gob.i + cycleOffset) % EYES.length];
  gob.body.material = bodyMaterial(color.id);
  if (gob.eyes) gob.spinner.remove(gob.eyes);
  gob.eyes = buildEyes(eyeDef.id, color.id);
  gob.eyes.position.set(0, 0.92, 0.38);
  gob.spinner.add(gob.eyes);
  gob.color = color; gob.eyeDef = eyeDef;
  const warn = gob.tris > 2500 ? ' warn' : '';
  gob.div.innerHTML = `<b>${gob.hat.name}</b> <span class="sub">${gob.hat.price ? gob.hat.price + 'c' : 'free'} L${gob.hat.level}</span><br>` +
    `<span class="sub">${eyeDef.name} eyes · ${color.name}${color.pattern !== 'solid' ? ' (' + color.pattern + ')' : ''}</span><br>` +
    `<span class="sub${warn}">${gob.tris} tris</span>`;
}
goblins.forEach(dress);

document.getElementById('stats').innerHTML =
  `${HATS.length} hats · ${COLORS.length} colours · ${EYES.length} eyes · ${EMOTES.length} emotes<br>` +
  `heaviest hat: ${maxTrisHat} (${maxTris} tris)`;
document.getElementById('emotes').textContent = EMOTES.map(e => `${e.emoji} ${e.name}`).join('  ');

const sw = document.getElementById('swatches');
for (const c of COLORS) {
  const d = document.createElement('span');
  d.className = 'sw';
  const a = '#' + colorHex(c.id).toString(16).padStart(6, '0'), b = '#' + c.hex2.toString(16).padStart(6, '0');
  d.innerHTML = `<i style="background:linear-gradient(135deg, ${a} 55%, ${b} 55%)"></i>${c.name}`;
  sw.appendChild(d);
}

// --- simple orbit camera ---------------------------------------------------------------
const target = new THREE.Vector3(0, 0.9, 0);
const goal = target.clone();
let theta = 0, phi = 1.0, dist = 17, goalDist = 17;
let dragging = false, lx = 0, ly = 0;
renderer.domElement.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; });
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', e => {
  if (!dragging) return;
  theta -= (e.clientX - lx) * 0.006; phi = Math.min(1.5, Math.max(0.15, phi - (e.clientY - ly) * 0.006));
  lx = e.clientX; ly = e.clientY;
});
renderer.domElement.addEventListener('wheel', e => { e.preventDefault(); goalDist = Math.min(40, Math.max(1.5, goalDist * (1 + Math.sign(e.deltaY) * 0.1))); }, { passive: false });
focusSel.addEventListener('change', () => {
  const i = +focusSel.value;
  if (i < 0) { goal.set(0, 0.9, 0); goalDist = 17; phi = 1.0; theta = 0; }
  else { goal.copy(goblins[i].root.position).add(new THREE.Vector3(0, 1.2, 0)); goalDist = 3.4; phi = 1.2; theta = 0; }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const rotateEl = document.getElementById('rotate'), cycleEl = document.getElementById('cycle'), labelsOnEl = document.getElementById('labelsOn');
let last = performance.now(), cycleTimer = 0, time = 0;
const v = new THREE.Vector3();

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  const cv = renderer.domElement;
  if (cv.width !== Math.floor(innerWidth * renderer.getPixelRatio()) || cv.height !== Math.floor(innerHeight * renderer.getPixelRatio())) {
    renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  }
  target.lerp(goal, 1 - Math.pow(0.001, dt));
  dist += (goalDist - dist) * (1 - Math.pow(0.001, dt));
  camera.position.set(target.x + dist * Math.sin(phi) * Math.sin(theta), target.y + dist * Math.cos(phi), target.z + dist * Math.sin(phi) * Math.cos(theta));
  camera.lookAt(target);

  if (cycleEl.checked) {
    cycleTimer += dt;
    if (cycleTimer > 3) { cycleTimer = 0; cycleOffset++; goblins.forEach(dress); }
  }
  for (const g of goblins) {
    if (rotateEl.checked) g.spinner.rotation.y += dt * 0.5;
    const t = time + g.phase;
    // wobble
    g.spinner.rotation.z = Math.sin(t * 3) * 0.03;
    // look around
    const lx2 = Math.sin(t * 0.9) * 0.05, ly2 = Math.cos(t * 0.7) * 0.03;
    for (const p of g.eyes.userData.pupils) p.position.set(lx2, ly2, 0);
    // blink
    const b = (t % 3.2) < 0.18 ? Math.sin((t % 3.2) / 0.18 * Math.PI) : 0;
    for (const l of g.eyes.userData.lids) l.scale.y = b;
    if (g.eyes.userData.spin) for (const s of g.eyes.userData.spin) s.rotation.z -= dt * 3;
    // label
    if (labelsOnEl.checked) {
      v.copy(g.root.position); v.y += 2.35; v.project(camera);
      const vis = v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1;
      g.div.style.display = vis ? '' : 'none';
      if (vis) { g.div.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; g.div.style.top = ((1 - v.y) / 2 * innerHeight) + 'px'; }
    } else g.div.style.display = 'none';
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__goblins = goblins; // for poking at in devtools
window.__view = (i, d = 3.4, th = 0.5, ph = 1.25, dx = 0) => { goal.copy(goblins[i].root.position).add(new THREE.Vector3(dx, 1.3, 0)); goalDist = d; theta = th; phi = ph; target.copy(goal); dist = d; };
</script>
</body>
</html>
